<h1>{{ 'auth.loginTitle' | translate }}</h1>

<form [formGroup]="loginForm" (ngSubmit)="login()">
  <div class="form-field">
    <label for="name">{{ 'auth.username' | translate }}</label>
    <input formControlName="name" type="text" id="name" placeholder="Enter username" />
  </div>
  <div class="form-field">
    <label for="password">{{ 'auth.password' | translate }}</label>
    <input formControlName="password" type="password" id="password" placeholder="Password" />
  </div>
  @if (errorMessage) {
    <p class="alert alert-danger">{{ errorMessage }}</p>
  }
  <button type="submit" class="btn btn-primary">{{ 'auth.submit' | translate }}</button>
</form>
