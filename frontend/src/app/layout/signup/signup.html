<h1>{{ 'auth.signupTitle' | translate }}</h1>

<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="name">{{ 'auth.username' | translate }}</label>
    <input id="name" type="text" formControlName="name" />
  </div>
  <div class="form-field">
    <label for="password">{{ 'auth.password' | translate }}</label>
    <input id="password" type="password" formControlName="password" />
  </div>
  <div class="form-field">
    <label for="gender">{{ 'auth.gender' | translate }}</label>
    <select id="gender" formControlName="gender">
      <option value="male">{{ 'auth.male' | translate }}</option>
      <option value="female">{{ 'auth.female' | translate }}</option>
    </select>
  </div>
  @if (successMessage) {
    <p class="alert alert-success">
      {{ successMessage }} -
      <a (click)="goToLogin()" style="cursor: pointer">{{ 'nav.login' | translate }}</a>
    </p>
  }
  @if (errorMessage) {
    <p class="alert alert-danger">{{ errorMessage }}</p>
  }
  <button type="submit" class="btn btn-primary">{{ 'auth.create' | translate }}</button>
</form>
