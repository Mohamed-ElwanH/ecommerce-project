<h1>Our Products</h1>

<div class="toolbar filters" [formGroup]="filters">
  <label for="category" style="margin: 0">Category</label>
  <select
    id="category"
    formControlName="category"
    (change)="onCategoryChange()"
    style="width: auto"
  >
    <option value="">All</option>
    @for (category of categories; track category) {
      <option [value]="category._id">{{ category.name }}</option>
    }
  </select>

  @if (subCategoriesOfSelectedCategory().length) {
    <label for="subCategory" style="margin: 0">Subcategory</label>
    <select id="subCategory" formControlName="subCategory" style="width: auto">
      <option value="">All</option>
      @for (sub of subCategoriesOfSelectedCategory(); track sub) {
        <option [value]="sub._id">{{ sub.name }}</option>
      }
    </select>
  }
</div>

<div class="grid">
  @for (product of filteredProducts; track product) {
    <app-product [myProduct]="product"></app-product>
  } @empty {
    <p>No products found.</p>
  }
</div>
